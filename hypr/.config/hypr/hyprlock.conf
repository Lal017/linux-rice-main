$fontFamily = Poiret One
$fontFamilyAlt = Bebas Neue

general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/clouds.jpg
    blur_passes = 2
    blur_size = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgb(255, 255, 255)
    font_size = 25
    font_family = $fontFamily
    position = 0, 30%
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +%I
    font_family = $fontFamilyAlt
    font_size = 200
    color = rgba(205, 214, 244, 1.0)
    position = 0, 20%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    font_family = $fontFamilyAlt
    font_size = 200
    color = rgba(205, 214, 244, 1.0)
    position = 0, 6%
    halign = center
    valign = center
}

# MUSIC BACKGROUND
image {
    monitor =
    path = /tmp/hyprlock-musicbg.png
    reload_time = 1
    border_size = 0
    size = 160
    rounding = 0
    position = 0, -40%
    halign = center
    valign = center
}

# CAVA
label {
    monitor =
    text = cmd[update:30] $HOME/.config/hypr/scripts/cava-line.sh
    font_family = DejaVu Sans Mono
    font_size = 19
    color = rgba(255, 255, 255, 1.0)
    position = 2.5%, -43%
    halign = center
    valign = center
}

# ALBUM IMAGE
image {
    monitor =
    path = /tmp/hyprlock-art.png
    reload_time = 1
    border_size = 0
    size = 120
    rounding = 20
    position = 38.3%, -40%
    halign = left
    valign = center
}

# MUSIC TITLE
label {
    monitor =
    text = cmd[update:1000] $HOME/.config/hypr/scripts/music-title.sh
    font_family = $fontFamily
    font_size = 22
    color = rgb(255, 255, 255)
    position = 44.5%, -40%
    halign = left
    valign = center
}

# USER ICON
image {
    monitor =
    path = ~/Pictures/icons/fern1x1.jpg
    size = 100
    rounding = -1
    border_size = 1
    position = 0, 30%
    halign = center
    valign = bottom
}

# PASSWORD FIELD
input-field {
    monitor =
    fade_on_empty = true
    size = 10%, 50
    rounding = -1
    position = 0, 24%
    halign = center
    valign = bottom
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.1
    font_family = $fontFamily
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    check_color = rgb(139, 85, 255)
    check_text = <i>Authenticating...</i>
    fail_color = rgba(255, 0, 0, 0.5)
    fail_text = <i>Access Denied</i>
    placeholder_text = <i>Password </i>
}