$fontFamily = Poiret One

# Horizontal center of the left panel, measured from screen center.
# Panel is 30% wide, so its center sits at 15% from the left edge,
# which is 35% to the left of screen center. If you change the panel
# width, set this to -(50% - panelWidth/2).
$panelX = -35%

general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = false
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/clouds.jpg
    blur_passes = 2
    blur_size = 5
}

# BACKGROUND SHAPE
shape {
    monitor =
    size = 30%, 100%
    color = rgba(17, 17, 17, 0.29)
    rounding = 0
    halign = left
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    color = rgba(255, 255, 255, 1.0)
    font_family = $fontFamily
    font_size = 90
    position = $panelX, 380
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgb(255, 255, 255)
    font_size = 30
    font_family = $fontFamily
    position = $panelX, 290
    halign = center
    valign = center
}

# USER ICON
image {
    monitor =
    path = ~/Pictures/icons/fern1x1.jpg
    size = 300
    rounding = -1
    position = $panelX, 50
    halign = center
    valign = center
}

# USER NAME PILL
shape {
    monitor =
    size = 20%, 50
    color = rgba(0, 0, 0, 0.5)
    rounding = -1
    position = $panelX, -210
    halign = center
    valign = center
}

# USER NAME
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1)
    font_family = $fontFamily
    font_size = 17
    position = $panelX, -210
    halign = center
    valign = center
}

# PASSWORD FIELD
input-field {
    monitor =
    fade_on_empty = false
    size = 20%, 50
    rounding = -1
    position = $panelX, -300
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.1
    font_family = $fontFamily
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    check_color = rgb(139, 85, 255)
    check_text = <i>Authenticating...</i>
    fail_color = rgba(255, 0, 0, 0.5)
    fail_text = <i>Access Denied</i>
    placeholder_text = <i>Password </i>
}