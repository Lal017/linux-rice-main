[dmenu]
dmenu_command = rofi -dmenu -i -no-show-icons -theme ~/.config/rofi/network.rasi
active_chars = 󰗠
compact = true
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s} {icon:>4}
list_saved = false
prompt = Networks

[dmenu_passphrase]
obscure = false
obscure_color = #222222

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = true
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
